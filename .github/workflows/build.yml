name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # also gives you a "Run workflow" button

permissions:
  contents: write           # needed to publish the download on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add icons, splash and notification icon
        run: cp -r android-res/. android/app/src/main/res/

      - name: Add home-screen widgets
        run: python3 widgets/apply_widgets.py

      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HerbTimer.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: HerbTimer-apk
          path: HerbTimer.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Herb Timer build ${{ github.run_number }}
          files: HerbTimer.apk
